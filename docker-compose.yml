services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "OraclePwd123"
      APP_USER: "SABG"
      APP_USER_PASSWORD: "123"
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle_data: